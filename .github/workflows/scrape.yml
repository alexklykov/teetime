name: scrape tee times

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Days including today (1-14)
        type: number
        default: 7
      course:
        description: Optional course slug for a smoke check
        type: string
        default: ''
      dry_run:
        description: Fetch without database or saved-session writes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: python -m pip install -r python/requirements.txt
      - name: Verify scraper behavior without network access
        run: python -m unittest discover -s python/tests -v
      - uses: actions/cache/restore@v4
        id: chromium
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('python/requirements.txt') }}
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      - name: Cache Chromium before refreshing providers
        if: steps.chromium.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('python/requirements.txt') }}
      - name: Refresh tee times
        shell: bash
        run: |
          args=(--days "$SCAN_DAYS")
          if [[ -n "$COURSE" ]]; then args+=(--course "$COURSE"); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          xvfb-run -a python python/ingest.py "${args[@]}"
        env:
          SCAN_DAYS: ${{ inputs.days || 7 }}
          COURSE: ${{ inputs.course || '' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          PYTHONUNBUFFERED: "1"
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          LAKEPADDEN_EMAIL: ${{ secrets.LAKEPADDEN_EMAIL }}
          LAKEPADDEN_PASSWORD: ${{ secrets.LAKEPADDEN_PASSWORD }}
      - name: Explain a failed refresh
        if: failure()
        run: |
          echo '::error::One or more refresh steps failed. See the run summary and logs; previous data is retained for failed dates.'
          echo 'Refresh failed. Check the failed step above. GitHub Actions notifications follow your GitHub notification settings.' >> "$GITHUB_STEP_SUMMARY"
